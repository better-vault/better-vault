name: ♿ Accessibility barrier
description: Something in better-vault is hard or impossible to reach, read or use.
labels: ["accessibility", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. You don't need to share anything about yourself or any disability,
        and screenshots or recordings are optional. ACCESSIBILITY.md explains what happens next.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: For example, add a source, read an answer's citations, or open a Studio output.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: What happened, and what you expected instead.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: What were you using? (optional)
      placeholder: For example, the desktop app on Windows with NVDA, or Safari with VoiceOver and zoom.
